[project]
name = "naql-ai"
version = "0.1.0"
description = "Naql.ai - Autonomous Logistics Ecosystem for Egypt"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
dependencies = [
    "asyncpg>=0.29,<1",
    "bcrypt>=4.0,<5",
    "email-validator>=2.0,<3",
    "fastapi>=0.110,<1",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "pyjwt>=2.8,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.29,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services", "gateway", "shared"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = ["E501", "TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["naql_common"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "grpc.*",
    "google.protobuf.*",
    "ortools.*",
    "pinecone.*",
    "strawberry.*",
    "nats.*",
    "paho.*",
    "h3.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require Docker)",
    "e2e: End-to-end tests",
]
